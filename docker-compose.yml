# Para correr Fulgoria local con Docker (o de referencia para EasyPanel).
#   1) cp .env.example .env  y completá AUTH_PASSWORD (hash) + SESSION_SECRET
#   2) docker compose up --build
services:
  fulgoria:
    build: .
    image: fulgoria:latest
    ports:
      - "3000:3000"
    env_file: .env
    restart: unless-stopped
    # Modo estudio (PERSISTENCIA=on): la base y los documentos sobreviven a los reinicios.
    volumes:
      - fulgoria-data:/data

volumes:
  fulgoria-data:
